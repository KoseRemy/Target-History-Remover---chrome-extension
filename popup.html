<link href="popup.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="output.css">
<script type="module" src="popup.js"></script>

<div class="w-72 p-4 bg-gray-900 text-white flex flex-col gap-3">
  <h1 class="text-lg font-bold">Target History Remover</h1>

  <div class="flex gap-2">
    <input id="addField" placeholder="Reddit"
      class="flex-1 px-2 py-1 rounded bg-gray-800 border border-gray-700 outline-none focus:border-blue-500" />
    <button id="addButton"
      class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-sm">Add Key Word</button>
  </div>

  <div id="bookmarks" class="bookmarks flex flex-col gap-1 max-h-48 overflow-y-auto"></div>

  <button id="removeHistoryButton"
    class="w-full py-2 rounded bg-red-600 hover:bg-red-500 font-semibold">Remove</button>
</div>
